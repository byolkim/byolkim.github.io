<!doctype html>
<html lang="{{ or site.LanguageCode "en" }}" class="light">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <canvas id="starry-canvas" aria-hidden="true"></canvas>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "components/headers/navbar.html" . }}

  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>

  {{ partial "site_footer.html" . }}
  {{ partial "components/search-modal.html" . }}

  <button class="to-top" id="to-top" type="button" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>

  <script>
  (function () {
    // Mobile nav
    var toggle = document.querySelector('[data-nav-toggle]');
    var menu = document.getElementById('primary-menu');
    if (toggle && menu) {
      toggle.addEventListener('click', function () {
        var open = menu.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
    }
    // Theme toggle
    var root = document.documentElement;
    var tbtn = document.getElementById('theme-toggle');
    if (tbtn) tbtn.addEventListener('click', function () {
      var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('theme', next); } catch (e) {}
    });
    // Back-to-top
    var top = document.getElementById('to-top');
    if (top) {
      addEventListener('scroll', function () { top.classList.toggle('show', scrollY > 500); }, { passive: true });
      top.addEventListener('click', function () { scrollTo({ top: 0, behavior: 'smooth' }); });
    }
    // Starry particle background (subtle; visible mainly in dark mode via CSS opacity)
    var canvas = document.getElementById('starry-canvas');
    if (canvas && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      var ctx = canvas.getContext('2d'), stars = [], W, H, raf;
      function resize() {
        W = canvas.width = innerWidth; H = canvas.height = innerHeight;
        var n = Math.min(90, Math.round(W * H / 18000));
        stars = [];
        for (var i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.3, a: Math.random(), s: Math.random() * 0.02 + 0.004, vx: (Math.random() - 0.5) * 0.06, vy: (Math.random() - 0.5) * 0.06 });
      }
      function draw() {
        ctx.clearRect(0, 0, W, H);
        var rgb = getComputedStyle(root).getPropertyValue('--star-rgb').trim() || '0,0,0';
        for (var i = 0; i < stars.length; i++) {
          var st = stars[i]; st.a += st.s; if (st.a > 1 || st.a < 0) st.s = -st.s;
          st.x += st.vx; st.y += st.vy;
          if (st.x < 0) st.x = W; if (st.x > W) st.x = 0; if (st.y < 0) st.y = H; if (st.y > H) st.y = 0;
          ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, 6.283);
          ctx.fillStyle = 'rgba(' + rgb + ',' + (0.15 + Math.abs(st.a) * 0.55) + ')'; ctx.fill();
        }
        raf = requestAnimationFrame(draw);
      }
      addEventListener('resize', resize); resize(); draw();
    }
  })();
  </script>
</body>
</html>
