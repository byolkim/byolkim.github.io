{{- $cur := . -}}
<header class="site-header">
  <nav class="navbar" aria-label="Primary">
    <a class="navbar__brand" href="{{ "/" | relURL }}" aria-label="{{ .Site.Params.author }} — home">{{ .Site.Params.author }}</a>
    <span class="navbar__spacer"></span>

    <button class="navbar__icon navbar__search" type="button" aria-label="Search this site" data-search-open>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </button>

    <button class="navbar__icon" id="theme-toggle" type="button" aria-label="Toggle light/dark theme">
      <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    </button>

    <button class="navbar__icon navbar__toggle" type="button" aria-label="Toggle navigation menu" aria-expanded="false" data-nav-toggle>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>

    <div class="navbar__nav" id="primary-menu">
      {{- range .Site.Menus.main }}
        {{- $active := or (eq $cur.RelPermalink (.URL | relLangURL)) (and (ne .URL "/") (hasPrefix $cur.RelPermalink (.URL | relLangURL))) -}}
        <a href="{{ .URL | relLangURL }}"{{ if $active }} class="is-active" aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
    </div>
  </nav>
</header>
