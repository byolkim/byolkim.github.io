<div class="search-modal" id="search-modal" hidden aria-hidden="true">
  <div class="search-modal__backdrop" data-search-close></div>
  <div class="search-modal__panel" role="dialog" aria-modal="true" aria-label="Search this site">
    <div id="search-ui">
      <input type="search" id="search-fallback-input" placeholder="Search publications, talks, software…" aria-label="Search query" autocomplete="off">
    </div>
    <p class="muted" id="search-hint" style="margin:.6rem 0 0;font-size:.85rem;">Press <kbd>Esc</kbd> to close.</p>
  </div>
</div>

<link rel="preload" as="style" href="{{ "pagefind/pagefind-ui.css" | relURL }}">
<script>
(function () {
  var modal = document.getElementById('search-modal');
  var uiRoot = document.getElementById('search-ui');
  var fallbackInput = document.getElementById('search-fallback-input');
  var loaded = false, lastFocus = null;

  function loadCSS(href) {
    var l = document.createElement('link'); l.rel = 'stylesheet'; l.href = href;
    document.head.appendChild(l);
  }
  function initPagefind() {
    if (loaded) return; loaded = true;
    loadCSS({{ (print "pagefind/pagefind-ui.css" | relURL) | jsonify }});
    var s = document.createElement('script');
    s.src = {{ (print "pagefind/pagefind-ui.js" | relURL) | jsonify }};
    s.onload = function () {
      try {
        uiRoot.innerHTML = '';
        new PagefindUI({ element: '#search-ui', showSubResults: true, showImages: false,
          resetStyles: false, translations: { placeholder: 'Search publications, talks, software…' } });
        var i = uiRoot.querySelector('input'); if (i) i.focus();
      } catch (e) { showFallback(); }
    };
    s.onerror = showFallback;
    document.head.appendChild(s);
  }
  function showFallback() {
    // Pagefind index not present (e.g. local preview without a Pagefind build):
    // degrade to a Google site: search rather than a dead box.
    uiRoot.innerHTML = '';
    uiRoot.appendChild(fallbackInput);
    fallbackInput.onkeydown = function (e) {
      if (e.key === 'Enter' && fallbackInput.value.trim()) {
        var q = encodeURIComponent('site:{{ replaceRE "https?://" "" .Site.BaseURL }} ' + fallbackInput.value.trim());
        window.open('https://www.google.com/search?q=' + q, '_blank', 'noopener');
      }
    };
    fallbackInput.focus();
  }
  function openModal() {
    lastFocus = document.activeElement;
    modal.hidden = false; modal.setAttribute('aria-hidden', 'false');
    initPagefind();
  }
  function closeModal() {
    modal.hidden = true; modal.setAttribute('aria-hidden', 'true');
    if (lastFocus) lastFocus.focus();
  }

  document.querySelectorAll('[data-search-open]').forEach(function (b) { b.addEventListener('click', openModal); });
  document.querySelectorAll('[data-search-close]').forEach(function (b) { b.addEventListener('click', closeModal); });
  document.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); modal.hidden ? openModal() : closeModal(); }
    if (e.key === 'Escape' && !modal.hidden) closeModal();
  });
})();
</script>
