cp:
  heading: "Conformal Prediction"
  term: "Spring 2026"
  note: "Replicate, then extend."
  # Submissions are withheld pending student consent to publish.
  projects:
    - title: "Survival Prediction Beyond the Clinic"
      students: "KSJ"
      blurb: 'Conformalized survival analysis was built for medical data, where censoring is the norm and calibrated uncertainty is essential. This project reproduces the framework of <a href="https://doi.org/10.1093/jrsssb/qkac004" target="_blank" rel="noopener">Candès et al. (2023)</a>, then asks whether it travels: can the same guarantees hold when the "survival time" is a financial event rather than a clinical one?'

    - title: "Understanding Prediction Set Efficiency in Conformal Ordinal Classification"
      students: "LSY"
      blurb: 'Medical diagnosis is rarely a yes-or-no question; severity comes in ordered grades, and a prediction set that respects that ordering is far more useful to a clinician. This project compares two conformal ordinal classifiers by <a href="https://doi.org/10.1007/978-3-031-16452-1_52" target="_blank" rel="noopener">Lu et al. (2022)</a> and <a href="https://doi.org/10.1609/aaai.v40i34.40098" target="_blank" rel="noopener">Zhang et al. (2026)</a> on a diabetic retinopathy dataset to see which ones deliver.'

    - title: "Taming Instability with Weight Clipping"
      students: "YYB"
      blurb: '<a href="https://openreview.net/pdf?id=JQtuCumAFD" target="_blank" rel="noopener">Davidov et al. (2025)</a> extend conformalized survival analysis to general right-censored data, but the method becomes unstable under heavy censoring. This project explores weight clipping as a remedy.'

