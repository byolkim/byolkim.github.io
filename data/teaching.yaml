  term: "Spring 2026"
  description: "The most scientific investigation of the most trivial question."
  vote_note: "The winner and runner-up were chosen by a class vote held after the final presentations. As such, the results reflect students' impressions of their classmates' presentations, rather than the instructor's evaluation."
